[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-agent-mcp"
version = "0.4.0"
description = "A layered, stateful MCP server for SolidWorks automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.7,<2",
  "pywin32>=305; platform_system == 'Windows'",
]

[project.scripts]
solidworks-agent-mcp = "solidworks_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
