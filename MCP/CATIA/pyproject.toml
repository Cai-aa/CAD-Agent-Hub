[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catia-agent-mcp"
version = "0.2.0"
description = "Capability-gated MCP server for CATIA V5 modeling and native CATIA Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.7,<2",
  "pywin32>=305; platform_system == 'Windows'",
]

[project.scripts]
catia-agent-mcp = "catia_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
